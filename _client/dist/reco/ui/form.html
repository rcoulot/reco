<script type="text/template" id="template">
    <div class="form" 
         style="display: grid;grid-template-columns: max-content auto;max-width: 100%;"
         id="<%= form.id %>">
    <%  
        form.items = {};
        for(let itemDef of form.formDef.itemsDef) { 
            let item = form.newItem(itemDef);
            item.obj = item.obj ? item.obj : form.obj;
            item.objList = item.objList ? item.objList : form.objList;
            form.debug("render form item",item)
            if (itemDef instanceof reco.ui.form.FormDefItemTitle) { %>@@form/title@@<% } 
            else if (itemDef instanceof reco.ui.form.FormDefItemLabel) { %>@@form/label@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemSimple) { %>@@form/simple@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemTree) { %>@@form/tree@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemSelect) { %>@@form/select@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemAction) { %>@@form/action@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemActions) { %>@@form/actions@@<% }
            else if (itemDef instanceof reco.ui.form.FormDefItemTable) { %>@@form/table@@<% }
       } 
    %>
    </div>
</script>
<script type="text/template" id="title"><% form.debug("render form template title, item >",item);  %>
    <div class="form-title <%=item.cssClassObjId%>" style="grid-column: 1 / span 2" id="<%=item.id%>-title"><%= item.label%></div>
</script>
<script type="text/template" id="label"><% form.debug("render form template label, item >",item);  %>
    <div class="label-label label" id="<%=item.id%>-label"><%= item.label %></div>
    <div class="label-value value <%=item.cssClassObjId%>" id="<%=item.id%>-value"><%= item.value %></div>
</script>
<script type="text/template" id="simple">
    <div class="simple-label label" id="<%=item.id%>-label"><%= item.label %></div>
    <input class="simple-input value editable <%=item.cssClassObjId%>"  id="<%=item.id%>-input"" type="text" value="<%= item.value %>">
</script>
<script type="text/template" id="tree"><% form.debug("render form template tree, item >",item);  %>
    <div class="tree-label label" style="grid-column: 1 / span 2" id="<%=item.id%>-label"><%= item.label %></div>
    <div class="div-tree" style="grid-column: 1 / span 2" id="<%=item.id%>">
    </div>
</script>
<script type="text/template" id="select"><% form.debug("render form template select, item >",item);  %>
    <div class="select-label label" id="<%=item.id%>-label"><%= item.label %></div>
    <select class="select-select value editable <%=item.cssClassObjId%>"  id="<%=item.id%>-select">
        <%  let selectedValue = item.value
            for(let option of item.selectOptions) { %>
            <option value="<%= option.value %>" <%= option.value === selectedValue ? 'selected' : '' %> ><%= option.label %></option>
        <% } %>
    </select>
</script>
<script type="text/template" id="action"><% form.debug("render form template action, item >",item);  %>
    <button type="button" class="action-button" id="<%= item.id %>"><%= item.label %></button>
</script>
<script type="text/template" id="actions"><% form.debug("render form template actions, item >",item);  %>
    <div class="actions-label label" id="<%=item.id%>-label"><%= item.label %></div>
    <div class="actions-buttons">
        <%  let parent = item;
            for(let actionDef of parent.itemDef.actionsDef) { 
            let item = form.newItem(actionDef,parent); %>
            <button type="button" class="action-button" id="<%= item.id %>"><%= item.label %></button>
        <% } %>
    </div>
</script>
<script type="text/template" id="table"><% form.debug("render form template table, item >",item);  %>
    <div class="table-label label" style="grid-column: 1 / span 2"><%= item.label %></div>
    <div class="div-table" style="grid-column: 1 / span 2">
    <table style="table-layout: fixed;" class="table-table resizable<%= item.itemDef.isResizable ? '' : ' not-resizable' %>" reco-width="RECOPAGEWIDTH - 20">
        <thead>
            <% let parent = item;
                form.debug("render form template table header, parent >",parent);
                for(let colDef of parent.itemDef.colsDef) { 
                    colDef.tdWidth = colDef.tdWidth ? colDef.tdWidth : (100/parent.itemDef.colsDef.length)+"%";
                    form.debug("render form template table header, colDef >",colDef);
                    let item = form.newItem(colDef, parent);
                    form.debug("render form template table header, col item >",item);
                    let isColDefAction = colDef instanceof reco.ui.form.FormDefItemAction ||
                                        colDef instanceof reco.ui.form.FormDefItemActions; %>
                <th style="overflow: hidden;white-space: nowrap;text-overflow: ellipsis;"><%= isColDefAction ? "" : item.label %></th>
            <%  } %>
        </thead>
        <tbody>
            <%  form.debug("table parent.objList => ",parent.objList);
                for(let index=0;index < parent.objList.length;index++) { %>
            <tr>
            <%      for(let colDef of item.itemDef.colsDef) {
                        let item = form.newItem(colDef, parent);
                        item.obj = parent.objList[index];
                        form.debug("render form template table row, colDef, obj >",colDef,item.obj);
                        let isColDefAction = colDef instanceof reco.ui.form.FormDefItemAction ||
                                             colDef instanceof reco.ui.form.FormDefItemActions;
                        if (isColDefAction) { %> 
                            <td style="overflow: hidden;white-space: nowrap;text-overflow: ellipsis;"
                                class="resizable <%=colDef.tdWidth !== 'false' && parent.itemDef.isResizable ? '' : 'not-resizable' %>" 
                                reco-width="RECOPARENTWIDTH * <%=colDef.tdWidth%>" id="<%=item.id%>-value%>">
                                <button type="button" class="action-button" id="<%= item.id %>" title="<%= item.label %>">
                                <%= item.label %></button>
                            </td> <%  
                        } else { %>
                            <td style="overflow: hidden;white-space: nowrap;text-overflow: ellipsis;"
                                class="<%=item.cssClassObjId%> resizable <%=colDef.tdWidth !== 'false' && parent.itemDef.isResizable ? '' : 'not-resizable' %>" 
                                reco-width="RECOPARENTWIDTH * <%=colDef.tdWidth%>" 
                                id="<%=item.id%>-value%>" 
                                title="<%= item.value %>"= ><%= item.value %></td>
                    <%  }
                    } %>
            </tr>
            <%  } %>
        </tbody>
    </table>
    </div>
</script>
